name: release
# GENERATED FILE. Source of truth: startup/skill-pkg/template/.github/workflows/release.yml
#
# Publishes to npm with SLSA provenance over OIDC on a v*.*.* tag, then cuts the
# GitHub Release. No secret is involved.
#
# This cannot make the FIRST publish. npm's trusted publishing is configured
# from an existing package's settings page, so a package that has never been
# published has no page to configure and the PUT answers 404. The first version
# of each skill therefore has to come from an authenticated session and will
# carry no provenance; from the version after it, this workflow owns it.
#
# Written in the future tense on purpose. It said "version 0.1.0 was therefore
# published from an authenticated session" until 2026-09-05, in six public
# repositories, and nothing in this set was on npm: a past-tense sentence about
# a publish that had not happened, in the workflow that would have performed it.
# `skill-pkg/release-state.mjs` holds the CHANGELOGs to the registry, and it
# does not read this file, which is why this one lasted a day longer.
#
# Do NOT run `gh release create` by hand: GitHub attributes a release to whoever
# created it, and that stamps an operator's personal account onto a public page
# that cannot be edited afterwards.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node --test
      - run: node scripts/check-house-style.mjs
      # OIDC trusted publishing needs npm >= 11.5.1 and the runner may bundle an
      # older 11.x. Pinned exactly, not `@latest`: this runs in the job that
      # holds id-token: write, so whatever the registry served that minute would
      # execute next to the publish credentials.
      - run: npm install -g npm@11.19.0
      # Skips when the registry already holds this version, instead of failing.
      #
      # The first version of each package cannot be published from here at all:
      # trusted publishing is configured from an existing package's settings
      # page, so it is published from an authenticated session and the tag comes
      # afterwards. Without this check that tag push runs `npm publish` over a
      # version that already exists, npm answers 403, and the run goes red - on
      # every repo in the set at once, for doing exactly what the release
      # procedure says to do. `denominator`'s v0.1.0 run is the recorded
      # instance of this shape.
      #
      # The GitHub Release below still gets cut, which is the half of this
      # workflow the tag is actually for once the package is already up.
      - name: publish, unless the registry already has this version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry; not republishing."
            echo "denominator: versions published by this run n=0"
            exit 0
          fi
          npm publish --provenance --access public
          echo "denominator: versions published by this run n=1"
      - run: npm publish --dry-run
        if: github.event_name == 'workflow_dispatch'
      - name: cut the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it alone"
            exit 0
          fi
          name=$(node -e "console.log(require('./package.json').name)")
          if [ -f CHANGELOG.md ]; then
            awk -v v="${GITHUB_REF_NAME#v}" '
              $0 ~ "^## \\[" v "\\]" { f = 1; next }
              f && (/^## \[/ || /^\[[^]]*\]: http/) { exit }
              f { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          fi
          if [ -s "$RUNNER_TEMP/notes.md" ] && grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            gh release create "$GITHUB_REF_NAME" --title "$name $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --title "$name $GITHUB_REF_NAME" --generate-notes
          fi
