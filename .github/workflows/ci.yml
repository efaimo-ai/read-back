name: ci
# GENERATED FILE. Source of truth: startup/skill-pkg/template/.github/workflows/ci.yml
#
# There is no build and no dependency to install, so CI is the three things that
# can actually be wrong: the installer's behaviour, the house rule, and whether
# the package that npm would publish still contains a skill.
#
# Windows is in the matrix because this package's whole job is writing files to
# a path, and paths are where POSIX-only testing goes blind.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - run: node scripts/check-house-style.mjs
      # The end to end path a reader takes, run for real: pack the package the
      # way npm would, install it from that tarball, and make it install itself
      # into a scratch directory. A unit test can pass while `files` in
      # package.json quietly stops shipping references/.
      - name: install from a packed tarball, the way a reader gets it
        shell: bash
        run: |
          set -euo pipefail
          # No absolute path is ever interpolated into a JS string or handed to
          # npm across a shell here, and that is not fastidiousness. The first
          # version of this step read the package name with
          # `node -e "require('$GITHUB_WORKSPACE/package.json')"`, and on Windows
          # that path is D:\a\read-back\read-back, so \r became a carriage return
          # and the module resolver looked for "D:a<CR>ead-back". Six repos went
          # red at once, including read-back's, whose whole subject is a shell
          # rewriting the payload it carries.
          #
          # So: a relative require, and the tarball is copied next to the consumer
          # rather than referenced across directories.
          name=$(node -p "require('./package.json').name")
          tarball=$(npm pack --silent)
          mkdir -p "$RUNNER_TEMP/consumer"
          cp "$tarball" "$RUNNER_TEMP/pkg.tgz"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund ../pkg.tgz >/dev/null
          npx --no-install "$name" --dir skills
          npx --no-install "$name" --dir skills --check
          test -f "skills/$name/SKILL.md"
          echo "installed $name from its own tarball into skills/$name and the check agreed"
